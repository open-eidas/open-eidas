[package]
name = "oe-hsm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Accès à la clé de signature de la TSU via PKCS#11 — la clé privée ne quitte jamais le token (portage de internal/hsm)."

[lints]
# oe-hsm est la seule crate du workspace autorisée à contenir du unsafe : les
# bindings PKCS#11 en dépendent. Toute autre crate doit rester #![forbid(unsafe_code)].

[dependencies]
cryptoki = "0.12"
sha2 = { version = "0.10", features = ["oid"] }
thiserror = "2"
rsa = "0.9"
rand = "0.8"
