[package]
name = "oe-audit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Journal d'audit chaîné par hachage SHA-256, JSON Lines — portage de internal/audit."

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
fs2 = "0.4"
time = { version = "0.3", features = ["std", "formatting"] }

[dev-dependencies]
tempfile = "3"
