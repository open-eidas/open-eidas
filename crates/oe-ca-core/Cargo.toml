[package]
name = "oe-ca-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Moteur d'émission et de révocation de la CA (profils, cérémonie, CRL) — portage de internal/ca."

[lints]
workspace = true

[dependencies]
oe-hsm = { path = "../oe-hsm" }
oe-certs = { path = "../oe-certs" }
oe-castore = { path = "../oe-castore" }
der = "0.8"
x509-cert = { version = "0.3", features = ["builder", "hazmat"] }
spki = "0.8"
signature = "3"
sha2 = "0.10"
sha1 = "0.10"
rand = "0.8"
time = { version = "0.3", features = ["std", "formatting"] }
thiserror = "2"
tracing = "0.1"
serde_json = "1"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
base64 = "0.22"
