[package]
name = "oe-enroll"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Client d'enrôlement HTTP (CSR + HMAC-SHA256) vers ca-server — portage de internal/enroll."

[lints]
workspace = true

[dependencies]
oe-hsm = { path = "../oe-hsm" }
oe-certs = { path = "../oe-certs" }
der = "0.8"
x509-cert = "0.3"
spki = "0.8"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["std"] }
thiserror = "2"
tracing = "0.1"
pem = "3"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.8"
rsa = "0.9"
