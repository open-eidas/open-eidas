[package]
name = "oe-s3"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Client S3-compatible minimal (SigV4) pour le stockage objet auto-hébergé des journaux d'audit — portage manuel, sans SDK AWS."

[lints]
workspace = true

[dependencies]
rusty-s3 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.8"
