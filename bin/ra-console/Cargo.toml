[package]
name = "ra-console"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Console d'exploitation RA/CA : relais des actions signées vers ca-server, sessions, lecture (docs/WEBUI.md)."

[lints]
workspace = true

[[bin]]
name = "ra-console"
path = "src/main.rs"

# ra-console n'ouvre jamais de session PKCS#11 (docs/WEBUI.md §16) : aucune
# dépendance directe à oe-hsm ni à oe-ca-core, dont le code de signature n'a rien
# à faire ici (oe-enroll ne tire d'oe-hsm que le trait `SigningToken`, pour signer
# sa CSR avec une clé logicielle). Les constantes du lien interne viennent de
# oe-conformance.
[dependencies]
oe-conformance = { path = "../../crates/oe-conformance" }
oe-enroll = { path = "../../crates/oe-enroll" }
oe-certs = { path = "../../crates/oe-certs" }
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
der = { version = "0.8", features = ["pem", "std"] }
x509-cert = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["std", "formatting"] }
thiserror = "2"

[dev-dependencies]
ca-server = { path = "../ca-server" }
oe-ca-core = { path = "../../crates/oe-ca-core" }
oe-castore = { path = "../../crates/oe-castore", features = ["postgres"] }
oe-hsm = { path = "../../crates/oe-hsm" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rsa = "0.9"
rand = "0.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
