[package]
name = "ocsp-responder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portage Rust de cmd/ocsp-responder (RFC 6960)."

[lints]
workspace = true

[[bin]]
name = "ocsp-responder"
path = "src/main.rs"

[dependencies]
oe-hsm = { path = "../../crates/oe-hsm" }
oe-certs = { path = "../../crates/oe-certs" }
oe-enroll = { path = "../../crates/oe-enroll" }
oe-ocsp-core = { path = "../../crates/oe-ocsp-core" }
oe-conformance = { path = "../../crates/oe-conformance" }
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = "0.3"
der = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
