# Pile de démonstration Open eIDAS : PKI OpenXPKI + autorité d'horodatage.
#
# La configuration d'OpenXPKI est matérialisée par scripts/bootstrap.sh dans
# deploy/openxpki/openxpki-config (clone du dépôt amont + overlay Open eIDAS).
x-openxpki: &openxpki
  image: whiterabbitsecurity/openxpki3:3.34

services:
  db:
    container_name: openeidas_db
    image: mariadb:11.4
    command: --default-authentication-plugin=mysql_native_password
    user: mysql:mysql
    environment:
      MYSQL_DATABASE: openxpki
      MYSQL_USER: openxpki
      MYSQL_PASSWORD: openxpki
      MYSQL_ROOT_PASSWORD: topsecret
    volumes:
      - openxpkidb:/var/lib/mysql
      - openxpkidbsocket:/var/run/mysqld/
      - ./deploy/openxpki/openxpki-config/contrib/sql/mariadb-backend-schema.sql:/docker-entrypoint-initdb.d/01-backend.sql:ro
      - ./deploy/openxpki/openxpki-config/contrib/sql/mariadb-frontend-schema.sql:/docker-entrypoint-initdb.d/02-frontend.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  pki-server:
    <<: *openxpki
    container_name: openeidas_pki_server
    command: /usr/bin/openxpkictl start server --nd
    user: openxpki:openxpki
    group_add:
      - openxpkiclient
    tmpfs:
      - /tmp
    volumes:
      - ./deploy/openxpki/openxpki-config:/etc/openxpki
      - ./deploy/openxpki/local/client.key:/home/pkiadm/.oxi/client.key:ro
      - openxpkilog:/var/log/openxpki
      - openxpkisocket:/run/openxpkid
      - openxpkidbsocket:/var/run/mysqld/
      - openxpkidownload:/var/www/download
    healthcheck:
      test: /usr/bin/openxpkictl status server
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      db:
        condition: service_healthy

  pki-client:
    <<: *openxpki
    container_name: openeidas_pki_client
    command: /usr/bin/openxpkictl start client --nd
    user: openxpkiclient:openxpkiclient
    group_add:
      - www-data
    tmpfs:
      - /tmp
    volumes:
      - ./deploy/openxpki/openxpki-config/client.d:/etc/openxpki/client.d
      - openxpkilogui:/var/log/openxpki-client
      - openxpkisocket:/run/openxpkid
      - openxpkiclientsocket:/run/openxpki-clientd
      - openxpkidbsocket:/var/run/mysqld/
    healthcheck:
      test: /usr/bin/openxpkictl status client
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      pki-server:
        condition: service_healthy

  pki-web:
    <<: *openxpki
    container_name: openeidas_pki_web
    command: /usr/bin/start-webserver apache
    ports:
      - "8080:80/tcp"
      - "8443:443/tcp"
    volumes:
      - ./deploy/openxpki/openxpki-config/contrib/apache2-openxpki-site.conf:/etc/apache2/sites-enabled/openxpki.conf:ro
      - ./deploy/openxpki/openxpki-config/tls/:/etc/openxpki/tls/
      - openxpkiclientsocket:/run/openxpki-clientd
      - openxpkidownload:/var/www/download:ro
    healthcheck:
      test: wget -q -O /dev/null http://localhost/healthcheck/ping
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      pki-client:
        condition: service_healthy

  tsa:
    container_name: openeidas_tsa
    build:
      context: .
      dockerfile: deploy/tsa/Dockerfile
      args:
        VERSION: ${OPENEIDAS_VERSION:-dev}
    ports:
      - "8318:8318"
    environment:
      OPENEIDAS_PIN: ${OPENEIDAS_PIN:-1234}
      OPENEIDAS_TOKEN_LABEL: open-eidas-tsa
      OPENEIDAS_KEY_LABEL: tsu-signing-key
      OPENEIDAS_KEY_BITS: "3072"
      OPENEIDAS_POLICY_OID: ${OPENEIDAS_POLICY_OID:-1.3.6.1.4.1.99999.1.1.1}
      OPENEIDAS_ACCURACY: 1s
      OPENEIDAS_CERT_FILE: /var/lib/open-eidas/state/tsu.pem
      OPENEIDAS_CHAIN_FILE: /var/lib/open-eidas/state/chain.pem
      OPENEIDAS_ENROLL_ENDPOINT: https://pki-web/rpc/tsa/RequestCertificate
      # Le conteneur OpenXPKI génère un certificat TLS auto-signé : acceptable
      # pour la démonstration locale uniquement, à remplacer par une ancre de
      # confiance explicite (OPENEIDAS_ENROLL_CA_FILE) en production.
      OPENEIDAS_ENROLL_INSECURE: "true"
      OPENEIDAS_SUBJECT_CN: ${OPENEIDAS_SUBJECT_CN:-tsa.openxpki.test}
    volumes:
      - softhsmtokens:/var/lib/softhsm/tokens
      - tsastate:/var/lib/open-eidas/state
    healthcheck:
      test: ["CMD", "tsa-server", "version"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      pki-web:
        condition: service_healthy

volumes:
  openxpkidb:
  openxpkidbsocket:
  openxpkisocket:
  openxpkiclientsocket:
  openxpkilog:
  openxpkilogui:
  openxpkidownload:
  softhsmtokens:
  tsastate:
