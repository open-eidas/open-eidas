# Politique d'enrôlement de l'endpoint RPC « tsa ».
#
# Le demandeur doit prouver la possession du secret partagé
# ##ENROLLHMACKEY## (HMAC-SHA256 sur le CSR, voir internal/enroll) : sans ce
# secret, la requête est rejetée avant même d'atteindre le workflow. C'est
# la seule barrière d'entrée — l'émission reste automatique (approval_points
# à 0) pour que le service reste auto-hébergeable sans opérateur humain,
# conformément à la mission d'une API d'horodatage automatisable.
#
# ÉCART RESTANT — une instance destinée à la qualification doit en outre
# soumettre chaque demande à l'approbation d'un opérateur RA
# (allow_man_approv: 1, approval_points: 1), au prix de perdre
# l'automatisation complète.

label: Open eIDAS TSU Enrollment

renewal_period: "000060"

policy:
    # L'authentification HMAC ci-dessous remplace l'anonymat : un secret
    # partagé, pas une identité, mais suffisant pour qu'une clé volée du
    # secret côté TSA soit le seul moyen d'émettre un certificat frauduleux.
    allow_anon_enroll: 0
    allow_man_authen: 0

    # Émission immédiate, sans point d'approbation — voir l'écart ci-dessus.
    allow_man_approv: 0
    allow_eligibility_recheck: 0
    approval_points: 0

    # Une seule TSU active par sujet ; l'ancien certificat est révoqué lors
    # d'un renouvellement afin de garder une chaîne de confiance lisible.
    max_active_certs: 1
    auto_revoke_existing_certs: 1
    allow_replace: 1

    # Le service a besoin de la chaîne complète (CA émettrice + racine) pour
    # la joindre au jeton et la publier sur /api/v1/certificate.
    export_certificate: fullchain

# Secret partagé pour l'authentification HMAC-SHA256 du CSR (RFC voir
# OpenXPKI::Server::Workflow::Activity::Tools::CalculateRequestHMAC :
# hmac_sha256_hex(CSR au format DER, ce secret)). Substitué au démarrage par
# le même mécanisme que la clé du coffre de données (voir crypto.yaml).
hmac: "##ENROLLHMACKEY##"

profile:
    cert_profile: tsa_signer
    cert_subject_style: enroll

eligible:
    initial:
        value: 1
    renewal:
        value: 1
    onbehalf:
        value: 1
