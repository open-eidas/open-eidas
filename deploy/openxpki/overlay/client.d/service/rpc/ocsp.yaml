# Endpoint RPC exposé par le frontal OpenXPKI :
#   POST https://<pki>/rpc/ocsp/RequestCertificate
#
# Enrôle le certificat de signature du répondeur OCSP (voir
# internal/ocspresponder, cmd/ocsp-responder). La politique d'émission
# associée est définie côté serveur dans
# config.d/realm/<realm>/rpc/ocsp.yaml.

global:
    realm: democa

locale:
    language: en_US

auth:
    stack:
      - _System

input:
    allow_raw_post: 1
    parse_depth: 5

jose: ~

output:
    use_http_status_codes: 1

RequestCertificate:
    workflow: certificate_enroll
    input:
      - pkcs10
      - comment
      - signature
    output:
      - cert_identifier
      - certificate
      - chain
      - error_code
      - transaction_id
    env:
      - server
      - signer_cert
    pickup:
        workflow: check_enrollment
        input:
          - pkcs10
          - transaction_id
