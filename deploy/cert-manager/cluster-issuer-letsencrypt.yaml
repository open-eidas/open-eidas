# ClusterIssuer Let's Encrypt (production) référencé par
# deploy/helm/open-eidas/values-staging.yaml via l'annotation
# cert-manager.io/cluster-issuer: letsencrypt-prod.
#
# Préalable : cert-manager installé sur le cluster
#   (https://cert-manager.io/docs/installation/) et un ingress controller
#   exposé publiquement, avec les enregistrements DNS des hôtes concernés
#   déjà pointés dessus (le défi HTTP-01 ci-dessous exige que
#   http://<host>/.well-known/acme-challenge/... soit joignable depuis
#   Internet avant la première émission).
#
#   kubectl apply -f deploy/cert-manager/cluster-issuer-letsencrypt.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # Reçoit les notifications d'expiration proches de Let's Encrypt.
    email: contact@open-eidas.eu
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
