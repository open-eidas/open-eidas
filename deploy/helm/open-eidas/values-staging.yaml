# Surcouche de valeurs pour le déploiement public de démonstration sur
# staging-api.open-eidas.eu (TSA), staging-pki.open-eidas.eu (autorité de
# certification) et staging-ocsp.open-eidas.eu (répondeur OCSP).
#
# Préalables sur le cluster cible (non gérés par ce chart) :
#   - un ingress controller exposé publiquement (ex. ingress-nginx) ;
#   - cert-manager, avec un ClusterIssuer nommé "letsencrypt-prod" — voir
#     deploy/cert-manager/cluster-issuer-letsencrypt.yaml ;
#   - trois enregistrements DNS (A ou CNAME) pointant vers l'adresse publique
#     de l'ingress controller :
#       staging-api.open-eidas.eu   -> TSA (API RFC 3161)
#       staging-pki.open-eidas.eu   -> CA (publication de la CRL et du
#                                      certificat de la CA émettrice)
#       staging-ocsp.open-eidas.eu  -> répondeur OCSP (AIA ocsp)
#
# Utilisation :
#   helm install open-eidas deploy/helm/open-eidas \
#       --namespace open-eidas-staging --create-namespace \
#       -f deploy/helm/open-eidas/values-staging.yaml
# ou via deploy/argocd/application-staging.yaml.

tsa:
  ingress:
    enabled: true
    className: nginx
    host: staging-api.open-eidas.eu
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls:
      - hosts:
          - staging-api.open-eidas.eu
        secretName: open-eidas-tsa-tls

ca:
  # Gravée dans les points CRL et AIA des certificats émis : doit correspondre
  # à l'hôte ingress ci-dessous pour que la CRL et le certificat de la CA
  # soient réellement récupérables par un tiers qui vérifie.
  publicURL: "https://staging-pki.open-eidas.eu"
  ingress:
    enabled: true
    className: nginx
    host: staging-pki.open-eidas.eu
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls:
      - hosts:
          - staging-pki.open-eidas.eu
        secretName: open-eidas-pki-tls

ocsp:
  # Gravée dans l'extension AIA (champ "ocsp") du certificat TSU.
  publicURL: "https://staging-ocsp.open-eidas.eu"
  ingress:
    enabled: true
    className: nginx
    host: staging-ocsp.open-eidas.eu
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls:
      - hosts:
          - staging-ocsp.open-eidas.eu
        secretName: open-eidas-ocsp-tls
