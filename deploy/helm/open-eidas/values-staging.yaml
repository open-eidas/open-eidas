# Surcouche de valeurs pour le déploiement public de démonstration sur
# api.staging.open-eidas.eu (TSA), pki.staging.open-eidas.eu (autorité de
# certification) et ocsp.staging.open-eidas.eu (répondeur OCSP).
#
# Préalables sur le cluster cible, gérés hors de ce chart :
#   - un listener HTTPS par hôte (api/pki/ocsp.staging.open-eidas.eu) sur la
#     Gateway API "shared-gateway" (namespace "ingress"), chacun avec son
#     Certificate cert-manager — voir open-eidas/deploy pour ce qui EST géré
#     par ce dépôt (Application ArgoCD, Cluster CloudNativePG, SealedSecret) ;
#   - trois enregistrements DNS (A ou CNAME) pointant vers l'adresse publique
#     de shared-gateway :
#       api.staging.open-eidas.eu   -> TSA (API RFC 3161)
#       pki.staging.open-eidas.eu   -> CA (publication de la CRL et du
#                                      certificat de la CA émettrice)
#       ocsp.staging.open-eidas.eu  -> répondeur OCSP (AIA ocsp)
#   - le Secret "open-eidas-generated" (scellé via kubeseal, voir
#     open-eidas/deploy) présent dans le namespace open-eidas-staging avant
#     le premier déploiement — il fournit à la fois les valeurs sensibles de
#     ce chart et les identifiants de bootstrap du Cluster CloudNativePG.
#
# Utilisation :
#   helm install open-eidas deploy/helm/open-eidas \
#       --namespace open-eidas-staging --create-namespace \
#       -f deploy/helm/open-eidas/values-staging.yaml
# ou via l'app-of-apps open-eidas/deploy (apps/open-eidas-staging.yaml).

secrets:
  # Contient postgres-password, tsa-pin, ocsp-pin, ca-root-pin,
  # ca-issuing-pin, webdav-password, enroll-hmac-key — les mêmes clés que
  # templates/secrets/generated.yaml, mais scellées et committées plutôt que
  # générées sur le cluster : reproductible sur un autre cluster, à la
  # différence du motif `lookup`.
  existingSecret: open-eidas-generated

postgres:
  # Cluster CloudNativePG géré par open-eidas/deploy (hors de ce chart), pas
  # le StatefulSet postgres intégré.
  external:
    enabled: true
    host: open-eidas-staging-postgres-rw
    port: 5432

tsa:
  gateway:
    enabled: true
    host: api.staging.open-eidas.eu
  # Démo web officielle (open-eidas/demo, GitHub Pages) — seule origine
  # autorisée à appeler cette API de staging depuis un navigateur.
  corsAllowedOrigin: "https://demo.open-eidas.eu"

ca:
  # Gravée dans les points CRL et AIA des certificats émis : doit correspondre
  # à l'hôte de la Gateway ci-dessous pour que la CRL et le certificat de la
  # CA soient réellement récupérables par un tiers qui vérifie.
  publicURL: "https://pki.staging.open-eidas.eu"
  gateway:
    enabled: true
    host: pki.staging.open-eidas.eu

ocsp:
  # Gravée dans l'extension AIA (champ "ocsp") du certificat TSU.
  publicURL: "https://ocsp.staging.open-eidas.eu"
  gateway:
    enabled: true
    host: ocsp.staging.open-eidas.eu
