# Valeurs par défaut du chart Open eIDAS.
#
# Ce chart reproduit, en Kubernetes, exactement la pile du docker-compose de
# démonstration : MariaDB, une PKI OpenXPKI (racine + CA émettrice, profil
# TSU dédié), un serveur WebDAV de réplication du journal d'audit, et le
# service d'horodatage lui-même. Il est destiné à un déploiement piloté par
# ArgoCD (voir deploy/argocd/application.yaml) mais s'installe aussi bien en
# `helm install` direct.
#
# AVERTISSEMENT — comme le docker-compose, ce chart est une démonstration :
# hiérarchie de CA jetable, enrôlement authentifié par secret partagé et auto-approuvé, SoftHSM en lieu
# d'un HSM certifié. Voir docs/ARCHITECTURE.md pour les écarts au référentiel
# eIDAS et deploy/helm/open-eidas/README.md pour les adaptations nécessaires
# à un déploiement de production.

nameOverride: ""
fullnameOverride: ""

# Politique de tirage d'image commune à tous les composants du chart.
imagePullPolicy: IfNotPresent

tsa:
  image:
    repository: ghcr.io/open-eidas/open-eidas-tsa
    tag: "latest"
  replicaCount: 1
  service:
    port: 8318
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  persistence:
    softhsm:
      size: 256Mi
      storageClassName: ""
    state:
      size: 256Mi
      storageClassName: ""
  policyOID: "1.3.6.1.4.1.99999.1.1.1"
  subject:
    commonName: "Open eIDAS Time-Stamping Unit 1"
    organizationalUnit: "Time Stamping Authority"
    organization: "Open eIDAS"
    country: "FR"
  time:
    policy: enforce # enforce | monitor | disabled
    sources: "ntp.obspm.fr,ptbtime1.ptb.de"
    minSources: 2
    maxOffset: 500ms
  crossTSA:
    urls: "https://freetsa.org/tsr,http://timestamp.digicert.com"
  audit:
    sealInterval: 1h
  # PIN du token PKCS#11, généré aléatoirement et conservé dans un Secret
  # si laissé vide (voir templates/secret-generated.yaml).
  pin: ""
  ingress:
    enabled: false
    className: ""
    host: tsa.open-eidas.example
    annotations: {}
    tls: []

ocsp:
  image:
    repository: ghcr.io/open-eidas/open-eidas-ocsp-responder
    tag: "latest"
  replicaCount: 1
  service:
    port: 8319
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }
  persistence:
    softhsm:
      size: 128Mi
      storageClassName: ""
    state:
      size: 128Mi
      storageClassName: ""
  # PIN du token PKCS#11 dédié à ce service, généré aléatoirement et
  # conservé dans un Secret si laissé vide (voir templates/secret-generated.yaml).
  pin: ""
  # Adresse publique du répondeur, gravée dans l'extension AIA du certificat
  # TSU. Vide = déduite de l'ingress si activé, sinon du nom DNS interne au
  # cluster (non résoluble de l'extérieur — à fixer explicitement pour tout
  # déploiement dont le certificat sera vérifié par des tiers).
  publicURL: ""
  ingress:
    enabled: false
    className: ""
    host: ocsp.open-eidas.example
    annotations: {}
    tls: []

openxpki:
  image:
    repository: whiterabbitsecurity/openxpki3
    tag: "3.34"
  configRef: community
  # Adresse publique de la PKI, gravée dans les points de distribution de CRL
  # et d'accès à la CA émettrice (CDP/AIA) du certificat TSU. Vide = déduite
  # de l'ingress si activé, sinon du nom DNS interne au cluster (non
  # résoluble de l'extérieur — à fixer explicitement pour tout déploiement
  # dont le certificat sera vérifié par des tiers).
  publicURL: ""
  service:
    webPort: 8443
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }
  # Images utilisées par les conteneurs d'initialisation de la configuration
  # (clonage du dépôt amont, application de l'overlay, génération des secrets
  # locaux au pod).
  gitImage: alpine/git:v2.54.0
  opensslImage: alpine/openssl:3.5.8
  ingress:
    enabled: false
    className: ""
    host: pki.open-eidas.example
    annotations: {}
    tls: []

mariadb:
  image:
    repository: mariadb
    tag: "11.4"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  persistence:
    size: 1Gi
    storageClassName: ""
  database: openxpki
  user: openxpki

auditReplica:
  image:
    repository: bytemark/webdav
    tag: "2.4"
  username: openeidas
  # Mot de passe généré aléatoirement si laissé vide.
  password: ""
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }
  persistence:
    size: 512Mi
    storageClassName: ""
