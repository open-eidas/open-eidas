{{- /*
Schéma d'amorçage de la base OpenXPKI (backend + frontend), tel que publié
par le dépôt openxpki-config. Copié sous files/sql/ pour être chargeable par
Helm — voir la note de synchronisation dans configmap-openxpki-overlay.yaml.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "open-eidas.fullname" . }}-mariadb-init
  labels:
    {{- include "open-eidas.labels" . | nindent 4 }}
data:
  {{- range $path, $content := .Files.Glob "files/sql/*.sql" }}
  {{ base $path }}: |
    {{- $content | toString | nindent 4 }}
  {{- end }}
