{{- $name := printf "%s-ca" (include "open-eidas.fullname" .) -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-state
  labels:
    {{- include "open-eidas.componentLabels" (dict "context" . "component" "ca") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.ca.persistence.state.storageClassName }}
  storageClassName: {{ .Values.ca.persistence.state.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.ca.persistence.state.size }}
