{{- if .Values.ca.gateway.enabled }}
{{- $name := printf "%s-ca" (include "open-eidas.fullname" .) -}}
# L'exposition externe n'est pas un confort : les extensions CDP et AIA des
# certificats émis pointent vers cet hôte, et un tiers qui vérifie un
# certificat doit pouvoir y récupérer la CRL et le certificat de la CA.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "open-eidas.componentLabels" (dict "context" . "component" "ca") | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.ca.gateway.name }}
      namespace: {{ .Values.ca.gateway.namespace }}
  hostnames:
    - {{ .Values.ca.gateway.host | quote }}
  rules:
    # Seuls les chemins de publication sont exposés : l'API d'enrôlement
    # reste interne au cluster, jointe par les services qui s'y enrôlent.
    - matches:
        - path:
            type: PathPrefix
            value: /download
      backendRefs:
        - name: {{ $name }}
          port: {{ .Values.ca.service.port }}
    - matches:
        - path:
            type: Exact
            value: /api/v1/ca.pem
      backendRefs:
        - name: {{ $name }}
          port: {{ .Values.ca.service.port }}
    - matches:
        - path:
            type: Exact
            value: /api/v1/conformance
      backendRefs:
        - name: {{ $name }}
          port: {{ .Values.ca.service.port }}
{{- end }}
