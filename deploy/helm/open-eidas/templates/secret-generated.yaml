{{- /*
Secret des valeurs sensibles générées automatiquement. Le motif `lookup`
ci-dessous les rend stables d'un `helm upgrade` à l'autre : une fois émis, un
mot de passe MariaDB ou le PIN du token PKCS#11 ne doit plus changer sous
peine de rendre les données déjà écrites (base, token SoftHSM) inaccessibles.
Une valeur explicitement fournie dans les values prime toujours sur celle,
existante ou générée, du Secret. `lookup` renvoie un dictionnaire vide (donc
faux dans un `if`) lorsque le Secret n'existe pas encore.
*/ -}}
{{- $secretName := include "open-eidas.generatedSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}

{{- $mariadbRootPassword := randAlphaNum 32 | b64enc -}}
{{- $mariadbPassword := randAlphaNum 32 | b64enc -}}
{{- /* crypto.yaml exige explicitement 64 caractères HEXADÉCIMAUX : randAlphaNum
produit des lettres hors a-f (g, k, n...), ce qui corrompt silencieusement le
déchiffrement des clés de CA stockées dans MariaDB ("signing token is not
online"). Deux UUIDv4 sans tirets donnent 64 caractères hexadécimaux propres. */ -}}
{{- $svaultKey := printf "%s%s" (uuidv4 | replace "-" "") (uuidv4 | replace "-" "") | lower | b64enc -}}
{{- $tsaPin := randNumeric 8 | b64enc -}}
{{- $webdavPassword := randAlphaNum 24 | b64enc -}}

{{- if $existing }}
{{- $mariadbRootPassword = index $existing.data "mariadb-root-password" }}
{{- $mariadbPassword = index $existing.data "mariadb-password" }}
{{- $svaultKey = index $existing.data "svault-key" }}
{{- $tsaPin = index $existing.data "tsa-pin" }}
{{- $webdavPassword = index $existing.data "webdav-password" }}
{{- end }}

{{- if .Values.tsa.pin }}
{{- $tsaPin = .Values.tsa.pin | b64enc }}
{{- end }}
{{- if .Values.auditReplica.password }}
{{- $webdavPassword = .Values.auditReplica.password | b64enc }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "open-eidas.labels" . | nindent 4 }}
type: Opaque
data:
  mariadb-root-password: {{ $mariadbRootPassword }}
  mariadb-password: {{ $mariadbPassword }}
  svault-key: {{ $svaultKey }}
  tsa-pin: {{ $tsaPin }}
  webdav-password: {{ $webdavPassword }}
