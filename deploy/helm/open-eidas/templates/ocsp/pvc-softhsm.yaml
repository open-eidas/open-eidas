{{- $name := printf "%s-ocsp" (include "open-eidas.fullname" .) -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-softhsm
  labels:
    {{- include "open-eidas.componentLabels" (dict "context" . "component" "ocsp") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.ocsp.persistence.softhsm.storageClassName }}
  storageClassName: {{ .Values.ocsp.persistence.softhsm.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.ocsp.persistence.softhsm.size }}
