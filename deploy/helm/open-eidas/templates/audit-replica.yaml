{{- $name := printf "%s-audit-replica" (include "open-eidas.fullname" .) -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "open-eidas.componentLabels" (dict "context" . "component" "audit-replica") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.auditReplica.persistence.storageClassName }}
  storageClassName: {{ .Values.auditReplica.persistence.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.auditReplica.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "open-eidas.componentLabels" (dict "context" . "component" "audit-replica") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "open-eidas.componentSelectorLabels" (dict "context" . "component" "audit-replica") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "open-eidas.componentSelectorLabels" (dict "context" . "component" "audit-replica") | nindent 8 }}
    spec:
      containers:
        - name: webdav
          image: "{{ .Values.auditReplica.image.repository }}:{{ .Values.auditReplica.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: AUTH_TYPE
              value: Basic
            - name: USERNAME
              value: {{ .Values.auditReplica.username | quote }}
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-eidas.generatedSecretName" . }}
                  key: webdav-password
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /var/lib/dav
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'wget -q -O /dev/null --header="Authorization: Basic $(printf ''%s:%s'' "$USERNAME" "$PASSWORD" | base64)" http://localhost/'
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            {{- toYaml .Values.auditReplica.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "open-eidas.componentLabels" (dict "context" . "component" "audit-replica") | nindent 4 }}
spec:
  selector:
    {{- include "open-eidas.componentSelectorLabels" (dict "context" . "component" "audit-replica") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
