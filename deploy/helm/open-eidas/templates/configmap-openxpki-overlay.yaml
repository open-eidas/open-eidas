{{- /*
Overlay Open eIDAS (profil de certificat TSU + endpoints RPC d'enrôlement),
identique à celui appliqué localement par scripts/bootstrap.sh. Les clés sont
nommées explicitement (plutôt que dérivées du chemin) car deux fichiers
source portent le même nom de base (tsa.yaml, côté serveur et côté client) ;
le Pod openxpki projette chaque clé au bon chemin relatif via `items[].path`
(voir templates/openxpki-statefulset.yaml).

Les fichiers sources vivent sous deploy/openxpki/overlay/ à la racine du
dépôt et sont dupliqués dans files/openxpki-overlay/ pour que Helm puisse les
charger (`.Files` ne voit que l'intérieur du chart) — les deux copies doivent
rester synchronisées.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "open-eidas.fullname" . }}-openxpki-overlay
  labels:
    {{- include "open-eidas.labels" . | nindent 4 }}
data:
  tsa-signer-profile.yaml: |
    {{- .Files.Get "files/openxpki-overlay/config.d/realm.tpl/profile/tsa_signer.yaml" | nindent 4 }}
  rpc-server-tsa.yaml: |
    {{- .Files.Get "files/openxpki-overlay/config.d/realm.tpl/rpc/tsa.yaml" | nindent 4 }}
  rpc-client-tsa.yaml: |
    {{- .Files.Get "files/openxpki-overlay/client.d/service/rpc/tsa.yaml" | nindent 4 }}
  ocsp-responder-profile.yaml: |
    {{- .Files.Get "files/openxpki-overlay/config.d/realm.tpl/profile/ocsp_responder.yaml" | nindent 4 }}
  rpc-server-ocsp.yaml: |
    {{- .Files.Get "files/openxpki-overlay/config.d/realm.tpl/rpc/ocsp.yaml" | nindent 4 }}
  rpc-client-ocsp.yaml: |
    {{- .Files.Get "files/openxpki-overlay/client.d/service/rpc/ocsp.yaml" | nindent 4 }}
