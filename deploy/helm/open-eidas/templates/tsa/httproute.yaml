{{- if .Values.tsa.gateway.enabled }}
{{- $name := printf "%s-tsa" (include "open-eidas.fullname" .) -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "open-eidas.componentLabels" (dict "context" . "component" "tsa") | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.tsa.gateway.name }}
      namespace: {{ .Values.tsa.gateway.namespace }}
  hostnames:
    - {{ .Values.tsa.gateway.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $name }}
          port: {{ .Values.tsa.service.port }}
{{- end }}
