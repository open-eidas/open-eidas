# Profil de certificat de l'unité d'horodatage (TSU) d'Open eIDAS.
#
# Le profil suit ETSI EN 319 422 :
#   - extendedKeyUsage réduit à id-kp-timeStamping et marqué critique ;
#   - keyUsage limité à la signature (digitalSignature / nonRepudiation) ;
#   - entité finale stricte (pas d'autorité de certification).

label: Open eIDAS Time-Stamping Unit

style:
    enroll:
        subject:
            dn: CN=[% CN.0 %],OU=Time Stamping Authority,O=Open eIDAS,C=FR

        metadata:
            entity: "[% cert_subject_parts.CN.0 FILTER lower %]"

validity:
    notafter: "+01"

digest: sha256

extensions:
    key_usage:
        critical: 1
        digital_signature: 1
        non_repudiation: 1

    extended_key_usage:
        critical: 1
        time_stamping: 1

    basic_constraints:
        critical: 1
        ca: 0

    # Point de distribution de CRL, publié par OpenXPKI lui-même sous
    # /download (voir apache2-openxpki-site.conf) et vérifié fonctionnel :
    # ##PKIPUBLICURL## est substitué au démarrage par la même mécanique que
    # le secret HMAC ou la clé du coffre de données — voir
    # scripts/bootstrap.sh et le chart Helm.
    #
    crl_distribution_points:
        critical: 0
        uri:
            - "##PKIPUBLICURL##/download/[% ISSUER.CN.0.replace('[^\\w-]','_') %].crl"

    # Sans ce bloc, OpenXPKI hérite silencieusement de
    # config.d/realm.tpl/profile/default.yaml, qui pointe ca_issuers et ocsp
    # vers pki.example.com/ocsp.example.com (voir
    # OpenXPKI::Crypt::Profile::_ext_basepath : un profil qui ne déclare pas
    # du tout la clé extensions.<nom> hérite intégralement du profil par
    # défaut). Déclarer la clé ici, même vide, masque cet héritage.
    #
    # ca_issuers : la hiérarchie de CA jetable de contrib/sampleconfig.sh
    # importe les clés directement (oxi token add) sans passer par le
    # workflow d'émission normal, qui est ce qui déclencherait la
    # publication automatique du certificat de CA (publishing.yaml,
    # section cacert) — publié explicitement à la place par
    # scripts/bootstrap.sh / le conteneur bootstrap du chart Helm, sous le
    # même nom de fichier (dérivé du CN de la CA) que la CRL ci-dessus,
    # mais au format DER (.cer).
    #
    # ocsp pointe vers un répondeur réellement fonctionnel
    # (cmd/ocsp-responder). ##OCSPPUBLICURL## est substitué au démarrage
    # par le même mécanisme que ##PKIPUBLICURL##.
    authority_info_access:
        critical: 0
        ca_issuers: "##PKIPUBLICURL##/download/[% ISSUER.CN.0.replace('[^\\w-]','_') %].cer"
        ocsp: "##OCSPPUBLICURL##/ocsp"
