name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  test:
    name: Format, vet, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # crypto11 se lie à un module PKCS#11 via dlopen (CGO) : la compilation
      # exige un compilateur C, pas le module lui-même.
      - name: Vérifie le formatage
        run: |
          fmt_diff="$(gofmt -l .)"
          if [ -n "$fmt_diff" ]; then
            echo "fichiers non formatés (gofmt -l) :"
            echo "$fmt_diff"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -cover ./...

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ${{ env.GO_VERSION }}

  build:
    name: Construction de l'image TSA
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construit l'image (sans publication)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/tsa/Dockerfile
          push: false
          load: true
          tags: openeidas-tsa:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}

      - name: Vérifie que le binaire démarre
        # SoftHSM exige un PIN de 4 à 255 caractères.
        run: docker run --rm -e OPENEIDAS_PIN=1234 openeidas-tsa:ci version

      - name: Scan de vulnérabilités (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: openeidas-tsa:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  helm-lint:
    name: Lint du chart Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: helm lint
        run: helm lint deploy/helm/open-eidas
      - name: helm template (rendu complet)
        run: helm template open-eidas deploy/helm/open-eidas > /dev/null

  helm-kind-smoke-test:
    name: Amorçage complet + démonstration (Helm sur kind)
    runs-on: ubuntu-latest
    needs: [build, helm-lint]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construit l'image TSA
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/tsa/Dockerfile
          push: false
          load: true
          tags: openeidas-tsa:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Crée un cluster kind
        uses: helm/kind-action@v1
        with:
          cluster_name: open-eidas

      - name: Charge l'image dans kind
        run: kind load docker-image openeidas-tsa:ci --name open-eidas

      - name: Installe le chart
        run: |
          helm install open-eidas deploy/helm/open-eidas \
            --namespace open-eidas --create-namespace \
            --set tsa.image.repository=openeidas-tsa \
            --set tsa.image.tag=ci \
            --set tsa.time.policy=monitor

      - name: Attend que tous les pods soient prêts
        run: |
          kubectl -n open-eidas wait --for=condition=ready pod --all --timeout=8m

      - name: Horodate un fichier et vérifie le jeton (openssl ts)
        run: |
          kubectl -n open-eidas port-forward svc/open-eidas-tsa 8318:8318 &
          sleep 3
          echo "facture CI $(date -Is)" > facture.txt
          openssl ts -query -data facture.txt -sha256 -cert -out facture.tsq
          curl -sf -H 'Content-Type: application/timestamp-query' \
              --data-binary @facture.tsq http://localhost:8318/tsa -o facture.tsr
          curl -sf http://localhost:8318/api/v1/certificate -o chain.pem
          awk '/BEGIN CERTIFICATE/{n++} {print > (n == 1 ? "tsu.pem" : "ca.pem")}' chain.pem
          openssl ts -verify -in facture.tsr -queryfile facture.tsq -CAfile ca.pem

      - name: Vérifie la chaîne du journal d'audit
        run: kubectl -n open-eidas exec deploy/open-eidas-tsa -- tsa-server verify-audit

      - name: État des pods et journaux (utile en cas d'échec)
        if: always()
        run: |
          kubectl -n open-eidas get pods -o wide
          kubectl -n open-eidas describe pods
          for c in server client web bootstrap; do
            echo "=== openxpki / $c ==="
            kubectl -n open-eidas logs deploy/open-eidas-openxpki -c "$c" --tail 200 || true
          done
          echo "=== tsa ==="
          kubectl -n open-eidas logs deploy/open-eidas-tsa --tail 200 || true

  compose-smoke-test:
    name: Amorçage complet + démonstration (docker compose)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Amorce la pile (PKI OpenXPKI + TSA)
        run: ./scripts/bootstrap.sh

      - name: Horodate un fichier et vérifie le jeton (openssl ts)
        run: ./scripts/demo.sh

      - name: Vérifie la chaîne du journal d'audit
        run: docker compose exec -T tsa tsa-server verify-audit

      - name: Journaux (utile en cas d'échec)
        if: always()
        run: docker compose logs --tail 200

      - name: Arrête la pile
        if: always()
        run: docker compose down -v
